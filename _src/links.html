<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavvy apps</title>
<meta name="description" content="All Wavvy apps for Android phone, tablet and TV in one place.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rizeteknoloji.com.tr/apps/">
<link rel="icon" href="/favicon.png" sizes="192x192" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b1533">
<meta property="og:site_name" content="Wavvy">
<meta property="og:title" content="Wavvy apps">
<meta property="og:description" content="Apps for your phone and TV.">
<meta property="og:url" content="https://rizeteknoloji.com.tr/apps/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tvplus.rizeteknoloji.com.tr/img/og.jpg">
<link rel="stylesheet" href="/fonts/wavvy.css">
<style>
/* Sosyal medya bio linki: tek sütun, telefon için. Renkler ana sayfayla aynı; her uygulama kendi renginde satır. */
:root{
  --bg:#f2f4f8; --card:#fff; --line:#dde2ec; --ink:#0b1533; --muted:#4b5672; --accent:#0b4dff;
  --tv:#1f4fd8; --cam:#17753a; --player:#6a3fc9; --vault:#35557a; --beam:#b84e0c; --words:#0e6b6b;
  --gold:#ffc233; --navy:#0b1533;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070c1c; --card:#111a35; --line:#242e54; --ink:#eef2ff; --muted:#a3adc9; --accent:#7b9cff;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
a{color:inherit;text-decoration:none}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
img,svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.w{max-width:520px;margin:0 auto;padding:36px 16px 28px}

.hd{text-align:center;margin-bottom:26px}
.icons{display:flex;justify-content:center;margin-bottom:16px}
.icons img{width:40px;height:40px;border-radius:11px;background:#fff;box-shadow:0 0 0 3px var(--bg);margin-left:-8px}
.icons img:first-child{margin-left:0}
h1{font:800 40px/1 var(--display);letter-spacing:-.03em}
.hd p{color:var(--muted);margin-top:8px}

.apps{display:grid;gap:12px}
.app{display:grid;grid-template-columns:52px 1fr;gap:6px 14px;align-items:center;border-radius:22px;background:var(--c);color:#fff;padding:16px}
.app img{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:#fff}
.app h2{font:800 21px/1.1 var(--display);letter-spacing:-.015em}
.app p{font-size:14.5px;line-height:1.35;color:rgba(255,255,255,.9)}
.app .act{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:8px;border-radius:999px;padding:11px 16px;font-weight:700;font-size:15px;background:#fff;color:var(--navy)}
.app .act svg{width:19px;height:19px}
.app:hover .act{background:var(--gold)}
.app :focus-visible,.app:focus-visible{outline-color:#fff}
.app.soon{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.app.soon p{color:var(--muted)}
.app.soon .act{background:none;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600}
.app.soon:hover .act{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

footer{text-align:center;color:var(--muted);font-size:14px;margin-top:28px;display:grid;gap:6px}
footer a{text-decoration:underline;text-underline-offset:3px}
footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gp" viewBox="0 0 24 24"><path fill="#00c4d6" d="M4 2.5 13.3 12 4 21.5a1.6 1.6 0 0 1-.8-1.4V3.9c0-.6.3-1.1.8-1.4z"/><path fill="#34d399" d="M16.4 8.9 13.3 12 4 2.5c.4-.3 1-.3 1.5 0l10.9 6.4z"/><path fill="#f6b91a" d="M20 11a1.2 1.2 0 0 1 0 2l-3.6 2.1-3.1-3.1 3.1-3.1L20 11z"/><path fill="#e53935" d="M16.4 15.1 5.5 21.5c-.5.3-1.1.3-1.5 0l9.3-9.5 3.1 3.1z"/></symbol>
</svg>
<main class="w">
 <header class="hd">
  <div class="icons">{{icons}}</div>
  <h1>Wavvy</h1>
  <p>Apps for your phone and TV</p>
 </header>
 <ul class="apps">
{{rows}}
 </ul>
 <footer>
  <a href="https://play.google.com/store/apps/developer?id=Rize+Teknoloji">All our apps on Google Play</a>
  <span>by <a href="/">Rize Teknoloji</a></span>
 </footer>
</main>
<script>
/* Bio linkinin sonundaki ?s=instagram|tiktok|youtube|facebook, Play linklerine utm_source olarak geçer;
   Play Console'un kullanıcı edinme raporu hangi platformun indirme getirdiğini buradan ayırır. */
(function(){
  var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase();
  if (!/^[a-z0-9_-]{1,24}$/.test(s)) return;
  var ref = encodeURIComponent('utm_source=' + s + '&utm_medium=social&utm_campaign=linkinbio');
  document.querySelectorAll('a[data-pkg]').forEach(function(a){
    a.href = 'https://play.google.com/store/apps/details?id=' + a.dataset.pkg + '&referrer=' + ref;
  });
})();
</script>
</body>
</html>
